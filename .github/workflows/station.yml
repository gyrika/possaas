# Releases Lume POS on every merge to main, in the safe order:
#   tests -> cloud staging -> cloud live -> Setup.exe (next version, e.g. 1.0.4 -> 1.0.5)
#   -> installed and checked on Windows Server 2022 and 2025 -> GitHub Release.
# Shop PCs look every 5 minutes and install it once their counter has been quiet for 15 minutes.
# - A pull request touching the Station, the server, the app or the cloud: built and tested on Windows
#   (and the Setup.exe is downloadable from the run's page), nothing released.
# - Actions tab > Run workflow: a test build, nothing released.
# The cloud is deployed only when the repository variable DEPLOY_CLOUD is "true" (and the two secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set). Off, a merge still tests and releases the
# Setup.exe. The installers are published here, in possaas' own Releases: the one place shop PCs
# update from and the cloud's /get page links to.
name: Lume POS

on:
  push:
    branches: [main]
    paths: ['deploy/station/**', '.github/workflows/station.yml', 'server/**', 'src/**', 'cloud/**', 'public/**', 'index.html', 'order.html', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['deploy/station/**', '.github/workflows/station.yml', 'server/**', 'src/**', 'cloud/**', 'public/**', 'index.html', 'order.html', 'package.json', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in the order they were merged.
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || github.run_id }}
  cancel-in-progress: false

jobs:
  # The cloud goes first: an older cloud refuses event types it does not know, which would stop the
  # shops' copy (docs/cloud.md). Staging, checked, then live.
  cloud:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install
        run: |
          npm ci
          npm ci --prefix cloud

      - name: Test
        run: npm test

      - name: Cloud staging
        if: vars.DEPLOY_CLOUD == 'true'
        run: |
          npm run migrate:staging --prefix cloud
          npm run deploy:staging --prefix cloud
          curl -fsS --retry 5 --retry-delay 3 https://melo-staging.cheesybeez-cloud.workers.dev/api/v1/health

      - name: Cloud live
        if: vars.DEPLOY_CLOUD == 'true'
        run: |
          npm run migrate --prefix cloud
          npm run deploy --prefix cloud
          curl -fsS --retry 5 --retry-delay 3 https://melo.cheesybeez-cloud.workers.dev/api/v1/health

  build:
    needs: cloud
    # Pull requests skip the cloud; a merge builds only once the cloud is live.
    if: always() && (needs.cloud.result == 'success' || (github.event_name != 'push' && needs.cloud.result == 'skipped'))
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for the next version number

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install
        run: npm ci

      - name: Test (on Windows)
        run: npm test

      - name: Build the app
        run: npm run build

      - name: Version
        id: version
        shell: pwsh
        run: |
          # A merge to main: the newest v* tag, one more (0.1.9 -> 0.1.10); the first release is 0.1.0.
          # Anything else: a test number.
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $last = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
            if ($last) {
              $p = [version]($last.TrimStart('v'))
              $v = "$($p.Major).$($p.Minor).$($p.Build + 1)"
            } else { $v = '0.1.0' }
          } else { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Stage
        shell: pwsh
        run: ./deploy/station/stage.ps1 -NodeVersion 22.23.3 -AppVersion ${{ steps.version.outputs.value }} -OfflineWebView2

      - name: The nightly backup works with the Node.js inside Setup.exe
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'cb-data'
          New-Item -ItemType Directory -Force $data | Out-Null
          $node = 'deploy/station/stage/node/node.exe'
          & $node -e "const { DatabaseSync } = require('node:sqlite'); const d = new DatabaseSync(process.argv[1]); d.exec('PRAGMA journal_mode = WAL; CREATE TABLE events (id TEXT); INSERT INTO events VALUES (1), (2)');" (Join-Path $data 'pos.sqlite')
          & $node --experimental-strip-types --no-warnings deploy/station/stage/app/server/sqliteBackup.ts $data nightly
          if ($LASTEXITCODE) { throw "The backup failed ($LASTEXITCODE)" }
          if (-not (Get-ChildItem (Join-Path $data 'backups') -Filter 'pos-*-nightly.sqlite')) { throw 'No backup file' }

      - name: Build the counter app (LumePOS.exe)
        run: dotnet build deploy/station/pos-app/LumePOS.csproj -c Release -o deploy/station/stage/pos-app

      - name: Check the counter app has everything it needs
        shell: pwsh
        run: |
          Get-ChildItem deploy/station/stage/pos-app -Recurse -File | ForEach-Object { $_.FullName.Replace((Resolve-Path deploy/station/stage/pos-app).Path, '') }
          foreach ($need in 'LumePOS.exe', 'Microsoft.Web.WebView2.Core.dll', 'Microsoft.Web.WebView2.WinForms.dll', 'WebView2Loader.dll') {
            if (-not (Get-ChildItem deploy/station/stage/pos-app -Recurse -Filter $need)) { throw "The counter app is missing $need" }
          }

      - name: Build Setup.exe (and the offline one, with WebView2 inside)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.version.outputs.value }}" deploy\station\LumePOS.iss
          if ($LASTEXITCODE) { throw "ISCC failed ($LASTEXITCODE)" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.version.outputs.value }}" /DOffline deploy\station\LumePOS.iss
          if ($LASTEXITCODE) { throw "ISCC failed for the offline Setup.exe ($LASTEXITCODE)" }
          Get-ChildItem deploy\station\Output

      - uses: actions/upload-artifact@v4
        with:
          name: LumePOS-Setup-${{ steps.version.outputs.value }}
          path: deploy/station/Output/LumePOS-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LumePOS-Offline-Setup-${{ steps.version.outputs.value }}
          path: deploy/station/Output/LumePOS-Offline-Setup-*.exe

  # The real Setup.exe on more than one Windows, the way a shop gets it: installed silently, then the
  # shop server, the counter app, the printer queue and the uninstall checked. Server 2022 is built on
  # Windows 10 21H2, Server 2025 on Windows 11 24H2. Nothing is released unless every one passes.
  install-test:
    needs: build
    if: always() && needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        setup: [LumePOS-Setup]
        include:
          - os: windows-2022
            setup: LumePOS-Offline-Setup
    runs-on: ${{ matrix.os }}
    name: install (${{ matrix.setup }}, ${{ matrix.os }})
    env:
      VERSION: ${{ needs.build.outputs.version }}
      APP: C:\Program Files\Lume POS
      DATA: C:\ProgramData\LumePOS
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.setup }}-${{ needs.build.outputs.version }}
          path: setup

      - name: Install silently
        shell: pwsh
        run: |
          $exe = (Get-ChildItem setup -Filter '*.exe' | Select-Object -First 1).FullName
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log" -Wait -PassThru
          if ($p.ExitCode) { Get-Content $log -Tail 60; throw "Setup.exe failed ($($p.ExitCode))" }
          # A test build is 0.0.N: the updater would replace it with the latest release, so it is switched off here.
          Disable-ScheduledTask -TaskName 'Lume POS update' | Out-Null

      - name: The shop server answers as this version
        shell: pwsh
        run: |
          $h = $null
          foreach ($i in 1..60) {
            try { $h = Invoke-RestMethod 'http://localhost:8080/api/v1/health' -TimeoutSec 5; break } catch { Start-Sleep 2 }
          }
          if (-not $h) { Get-Content "$env:DATA\logs\server.log" -Tail 60 -ErrorAction SilentlyContinue; throw 'The shop server did not start' }
          if ($h.version -ne $env:VERSION) { throw "The shop server says version $($h.version), not $env:VERSION" }
          if ((Invoke-WebRequest 'http://localhost:8080/' -UseBasicParsing).StatusCode -ne 200) { throw 'The POS page did not load' }
          # The setup wizard's first answer lists the PC's printers (Get-Printer).
          Invoke-RestMethod 'http://localhost:8080/api/v1/setup' | ConvertTo-Json -Depth 4
          if (-not (Test-Path "$env:DATA\pos.sqlite")) { throw 'No database in the data folder' }

      - name: Windows is set up (tasks, firewall, WebView2)
        shell: pwsh
        run: |
          foreach ($t in 'Lume POS', 'Lume POS update', 'Lume POS nightly') { Get-ScheduledTask -TaskName $t | Out-Null }
          $fw = Get-NetFirewallRule -DisplayName 'Lume POS'
          if ("$($fw.Profile)" -ne 'Any') { throw "The firewall rule is for $($fw.Profile) networks only: tablets on a 'Public' Wi-Fi are kept out" }
          if ("$(($fw | Get-NetFirewallAddressFilter).RemoteAddress)" -ne 'LocalSubnet') { throw 'The firewall rule must let in the shop network only' }
          if (-not (Test-Path "$env:PUBLIC\Desktop\Lume POS.lnk")) { throw 'No "Lume POS" shortcut on the desktop' }
          $wv = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          if (-not $wv -or $wv.pv -in @($null, '', '0.0.0.0')) { throw 'WebView2 is not installed' }
          "WebView2 $($wv.pv)"

      - name: The counter app starts and stays open
        shell: pwsh
        run: |
          $already = @(Get-Process LumePOS -ErrorAction SilentlyContinue)
          if ($already) { "Already running before the test: $($already | ForEach-Object { "$($_.Id) started $($_.StartTime)" })" }
          $p = Start-Process "$env:APP\pos-app\LumePOS.exe" -WorkingDirectory "$env:APP\pos-app" -PassThru
          Start-Sleep 15
          if ($p.HasExited) {
            # Evidence for why: another copy (it steps aside with exit 0), .NET or WebView2 errors.
            Get-Process LumePOS, msedgewebview2 -ErrorAction SilentlyContinue | Format-Table -AutoSize Id, ProcessName, StartTime
            Get-WinEvent -LogName Application -MaxEvents 60 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match '\.NET Runtime|Application Error|Windows Error Reporting' -or $_.Message -match 'LumePOS|msedgewebview2' } |
              Format-List TimeCreated, ProviderName, Message
            Get-ChildItem "$env:LOCALAPPDATA\LumePOS\pos-app" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 30 FullName
            throw "The counter app closed by itself (exit $($p.ExitCode))"
          }
          Stop-Process -Id $p.Id -Force

      - name: A receipt reaches the Windows printer queue unchanged
        shell: pwsh
        run: |
          # A text-only printer that writes to a file stands in for the Xprinter.
          $out = 'C:\cb-receipt.prn'
          Add-PrinterDriver -Name 'Generic / Text Only'
          Add-PrinterPort -Name $out
          Add-Printer -Name 'Lume POS test' -DriverName 'Generic / Text Only' -PortName $out
          $bytes = [byte[]](0x1B, 0x40) + [Text.Encoding]::ASCII.GetBytes("Lume POS test`n") + [byte[]](0x1D, 0x56, 0x00)
          $in = Join-Path $env:RUNNER_TEMP 'receipt.bin'
          [IO.File]::WriteAllBytes($in, $bytes)
          & "$env:APP\app\server\rawprint.ps1" -Printer 'Lume POS test' -Path $in
          foreach ($i in 1..15) { if ((Test-Path $out) -and (Get-Item $out).Length -ge $bytes.Length) { break }; Start-Sleep 1 }
          $got = [IO.File]::ReadAllBytes($out)
          if ([Convert]::ToBase64String($got) -ne [Convert]::ToBase64String($bytes)) { throw "The printer got $($got.Length) bytes, not the $($bytes.Length) sent" }

      - name: The support file, from the Start menu's script (works even when the POS does not start)
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Lume POS support file.lnk")) { throw 'No "Lume POS support file" in the Start menu' }
          $path = (& "$env:APP\node\node.exe" --experimental-strip-types --no-warnings "$env:APP\app\server\supportFile.ts" | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -or -not (Test-Path $path)) { throw "No support file ($path)" }
          if ($path -notlike "$env:PUBLIC\Desktop\Lume POS support *.zip") { throw "Not on the shared desktop: $path" }
          $open = Join-Path $env:RUNNER_TEMP 'support'
          Expand-Archive $path $open
          $about = Get-Content (Join-Path $open 'about.txt') -Raw
          $about
          foreach ($part in 'Shop server:    answering', '----- Printers -----', '----- Scheduled tasks -----', '----- WebView2 -----') {
            if (-not $about.Contains($part)) { throw "about.txt has no '$part'" }
          }
          if (-not (Test-Path (Join-Path $open 'logs\server.log'))) { throw 'No server log in it' }
          if (Get-ChildItem $open -Recurse -Filter '*.sqlite') { throw 'The database must never be in it' }

      - name: Uninstall keeps the shop's data
        shell: pwsh
        run: |
          Start-Process "$env:APP\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          if (Get-ScheduledTask -TaskName 'Lume POS' -ErrorAction SilentlyContinue) { throw 'The server task is still there' }
          if (-not (Test-Path "$env:DATA\pos.sqlite")) { throw "The uninstall removed the shop's database" }

  release:
    needs: [build, install-test]
    if: always() && github.event_name == 'push' && needs.build.result == 'success' && needs.install-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ needs.build.outputs.version }}'
          path: setup
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: setup/*.exe
          body: |
            Lume POS ${{ needs.build.outputs.version }}: download **LumePOS-Setup-${{ needs.build.outputs.version }}.exe** and double-click it.
            A PC without internet: **LumePOS-Offline-Setup-${{ needs.build.outputs.version }}.exe** (larger: it also carries Microsoft's WebView2).
            Needs Windows 10 (version 2004 or newer) or Windows 11, 64-bit.
            Windows may say "Windows protected your PC" the first time: click **More info**, then **Run anyway**.
            Shop PCs install it by themselves once their counter has been quiet for 15 minutes; the shop's data is kept.
