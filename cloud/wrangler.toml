# The Lume POS cloud copy . Deploy from this folder: npm run deploy
name = "melo"
main = "src/worker.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "melo"
database_id = "89d4100b-5d6a-49f7-8456-f4dacce35e2c"
migrations_dir = "migrations"

# The owner's phone page (the cloud build of the app; nothing else of the POS is served here).
[assets]
directory = "../dist-cloud"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/api/*", "/admin", "/admin/*", "/owner.webmanifest", "/manager.webmanifest", "/order", "/order/", "/order.html", "/order.webmanifest", "/questions", "/get", "/download"]

# Online ordering stays off: no shop takes orders through this cloud yet (ORDER_SHOP, ORDER_PHONE,
# ORDER_HOURS, ORDER_ADDRESS go under [vars] once one does).

# A test copy of the cloud, apart from the shops' live one: its own address and its own empty
# database. Try changes end to end over the internet before they reach the shops:
#   npm run deploy:staging  →  https://melo-staging.cheesybeez-cloud.workers.dev
[env.staging]
name = "melo-staging"
workers_dev = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "melo-staging"
database_id = "85e3e111-35c1-49b9-95a5-e8dd1c4f34ac"
migrations_dir = "migrations"
